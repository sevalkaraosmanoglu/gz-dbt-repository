version: 2
sources:
  - name: raw
    database: majestic-cairn-482009-d7
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez / one row per product_id per orders_id
        loaded_at_field: "CAST(date_date AS TIMESTAMP)"
        freshness:
          warn_after:
            count: 90
            period: day
        columns:
          - name: date_date
            description: Date of purchase
          - name: orders_id
            description: Unique identifier of the order
          - name: pdt_id
            description: Product identifier
          - name: revenue
            description: Revenue of this order line
          - name: quantity
            description: Quantity sold
        tests:
          - not_null:
              column_name: orders_id
          - not_null:
              column_name: pdt_id

      - name: product
        identifier: raw_gz_product
        description: Product information
        columns:
          - name: products_id
            description: Unique product identifier
          - name: purchase_price
            description: Purchase price of the product
        tests:
          - unique:
              column_name: products_id
          - not_null:
              column_name: products_id

      - name: ship
        identifier: raw_gz_ship
        description: Shipping information for each order
        columns:
          - name: orders_id
            description: Unique identifier of the order
          - name: shipping_fee
            description: Shipping fee
          - name: log_cost
            description: Logistical cost
          - name: ship_cost
            description: Shipping cost (converted to FLOAT64)
        tests:
          - unique:
              column_name: orders_id
          - not_null:
              column_name: orders_id

